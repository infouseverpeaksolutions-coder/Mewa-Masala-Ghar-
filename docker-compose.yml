version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mewa_masala_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-H@snain07}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mewa_masala_ghar}
      MYSQL_USER: ${MYSQL_USER:-mewa_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-H@snain07}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
